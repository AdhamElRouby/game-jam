# Optional persistent hosting on Render (free web service). Requires the developer to create a Render account.
services:
  - type: web
    name: shift-happens
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Render's proxy is the public edge; the container must accept its network
      - key: HOST
        value: 0.0.0.0
